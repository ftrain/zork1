<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZORK I — Clickable Map</title>
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'&gt;&lt;text y='13' font-size='13'&gt;🗺&lt;/text&gt;&lt;/svg&gt;">
<style>
  :root {
    --bg: #0b0d10;
    --panel: #12161b;
    --line: #232a33;
    --ink: #cfd6de;
    --dim: #6b7684;
    --acid: #7fe07f;
    --gold: #e0c060;
    --blood: #d06060;
    --sky: #6fb0e0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 13px; margin: 0; letter-spacing: .18em; color: var(--acid); }
  .stat { color: var(--dim); white-space: nowrap; }
  .stat b { color: var(--ink); font-weight: 600; }
  .spacer { flex: 1; }
  #mode {
    color: var(--sky); border: 1px solid var(--line); border-radius: 3px;
    padding: 2px 7px; font-size: 11px; letter-spacing: .1em;
  }
  button {
    font: inherit; color: var(--ink); background: #1a2029;
    border: 1px solid var(--line); border-radius: 3px;
    padding: 4px 9px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--acid); color: var(--acid); }
  button:disabled { opacity: .35; cursor: not-allowed; }

  main { flex: 1; display: flex; min-height: 0; }
  #mapwrap { flex: 1; position: relative; min-width: 0; }
  canvas {
    display: block; width: 100%; height: 100%; cursor: grab;
    touch-action: none;   /* the canvas handles its own pan and pinch */
  }
  canvas.drag { cursor: grabbing; }
  #hint {
    position: absolute; left: 10px; bottom: 8px; color: var(--dim);
    font-size: 11px; pointer-events: none;
  }

  aside {
    width: 360px; flex: none; border-left: 1px solid var(--line);
    background: var(--panel); overflow-y: auto; padding: 14px;
  }
  aside h2 { font-size: 15px; margin: 0 0 2px; color: var(--gold); }
  .meta { color: var(--dim); font-size: 11px; margin-bottom: 10px; }
  .desc { margin-bottom: 4px; }
  /* Room prose is long and the controls matter more on a phone, so it folds
     down to a few lines until tapped. */
  .desc.clamped {
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    overflow: hidden; cursor: pointer;
  }
  .desc.clamped::after { content: " more"; color: var(--sky); }
  h3 {
    font-size: 11px; letter-spacing: .16em; color: var(--dim);
    margin: 16px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 4px;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li { margin-bottom: 5px; }
  .item::before { content: "• "; color: var(--dim); }
  .item.treasure { color: var(--gold); }

  .exit {
    display: block; width: 100%; text-align: left; margin-bottom: 5px;
    padding: 6px 9px; line-height: 1.35;
  }
  .exit .dir { color: var(--acid); font-weight: 700; }
  .exit .new { color: var(--sky); }
  .exit .cond, .exit .sub { display: block; color: var(--dim); font-size: 11px; }
  .exit .key { float: right; color: var(--dim); }
  .blocked {
    padding: 6px 9px; margin-bottom: 5px; border: 1px dashed var(--line);
    border-radius: 3px; color: var(--dim);
  }
  .blocked .dir { color: var(--blood); font-weight: 700; }

  .compass { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .compass button { padding: 11px 2px; text-align: center; font-size: 12px; }
  .compass button.known { border-color: #3d6b3d; color: var(--acid); background: #16211a; }
  .compass button.hint { border-color: #38506b; color: var(--sky); }
  .compass button.wall { color: #59616b; border-style: dashed; opacity: .6; }
  .compass .blank { visibility: hidden; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .row button { font-size: 11px; }

  .thing {
    border: 1px solid var(--line); border-radius: 5px;
    padding: 8px 10px; margin-bottom: 7px;
  }
  .thing.nested {
    margin-left: 16px; border-left: 2px solid #2c343e; border-radius: 0 5px 5px 0;
  }
  .thing .nm { display: block; color: var(--ink); }
  .thing .nm.treasure { color: var(--gold); }
  .quote {
    color: #9fb0c0; font-size: 12px; margin: 4px 0 6px;
    padding-left: 8px; border-left: 2px solid #2c343e;
  }
  .says { margin: 8px 0; }
  .says b { color: var(--acid); font-weight: 600; }
  .says .when { color: var(--dim); font-size: 11px; }
  .unlock {
    margin: -2px 0 8px 9px; padding-left: 8px;
    border-left: 2px solid #4a3a6b; color: var(--ink); font-size: 12px;
  }
  .unlock .key2 { color: #9d86d0; letter-spacing: .05em; }
  .thing .what, aside > .what {
    color: var(--dim); font-size: 11px; margin: 2px 0 6px;
  }
  aside > .what { margin-top: -2px; }

  #log {
    white-space: pre-wrap; word-break: break-word; color: var(--ink);
    background: #0d1116; border: 1px solid var(--line); border-radius: 3px;
    padding: 8px; max-height: 190px; overflow-y: auto; font-size: 12px;
  }
  #log .cmd { color: var(--acid); }
  .trail { color: var(--dim); font-size: 11px; word-break: break-word; }

  /* Things you can talk about here: room contents, what you carry, and the
     scenery the ZIL source says this room will answer to. */
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    padding: 9px 11px; border-radius: 14px; border: 1px solid var(--line);
    background: #171d25; font-size: 12px;
  }
  .chip.carried { border-color: #4a5b3a; }
  .chip.scenery { color: var(--dim); }

  /* The action sheet: tap a thing, pick a verb, and if the verb wants a
     second thing, pick that too. Nothing here needs a keyboard. */
  #veil {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .55); z-index: 9;
  }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--panel); border-top: 1px solid var(--acid);
    border-radius: 12px 12px 0 0; padding: 12px 14px 18px;
    max-height: 76vh; overflow-y: auto;
    box-shadow: 0 -12px 32px rgba(0, 0, 0, .5);
  }
  #sheet[hidden], #veil[hidden] { display: none; }
  #sheet h4 {
    margin: 0 0 10px; font-size: 14px; color: var(--gold);
    display: flex; align-items: center; gap: 10px;
  }
  #sheet h4 .x { margin-left: auto; }
  #sheet .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 5px;
  }
  #sheet .grid button { padding: 11px 8px; text-align: left; }
  #sheet .sub { color: var(--dim); font-size: 11px; margin: 12px 0 6px; }

  @media (min-width: 761px) { aside { width: 360px; } }
  @media (max-width: 760px) {
    body { font-size: 14px; }
    main { flex-direction: column; }
    header { gap: 10px; padding: 7px 10px; }
    header h1 { font-size: 12px; }
    #mapwrap { flex: 0 0 38vh; }
    #hint { display: none; }
    aside {
      width: auto; border-left: 0; border-top: 1px solid var(--line);
      flex: 1; max-height: none; padding: 12px;
      -webkit-overflow-scrolling: touch;
    }
    button { padding: 9px 12px; }
    .row button { font-size: 12px; }
    header button { padding: 5px 9px; font-size: 11px; }
    /* Keep the header on one line: rooms and score are the ones worth the
       width on a phone. */
    #s-edges, #s-moves { display: none; }
    .stat.thin { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>ZORK I</h1>
  <span id="mode">ATLAS</span>
  <span class="stat">rooms <b id="s-rooms">0</b><span id="s-of"></span></span>
  <span class="stat thin">exits <b id="s-edges">0</b></span>
  <span class="stat thin">moves <b id="s-moves">0</b></span>
  <span class="stat" id="s-scorewrap" hidden>score <b id="s-score">0</b></span>
  <span class="spacer"></span>
  <button id="b-live">play the game</button>
  <button id="b-replay" hidden>replay a win</button>
  <button id="b-solve" hidden>let it solve</button>
  <button id="b-center">center</button>
  <button id="b-fit">fit</button>
  <button id="b-reveal">reveal all</button>
  <button id="b-reset">reset</button>
</header>
<main>
  <div id="mapwrap">
    <canvas id="map"></canvas>
    <div id="hint">drag to pan · scroll to zoom · click a known room to travel there</div>
  </div>
  <aside>
    <h2 id="r-name">—</h2>
    <div class="meta" id="r-meta"></div>
    <div class="desc" id="r-desc"></div>
    <div id="r-items"></div>
    <div id="r-exits"></div>
    <div id="r-actions"></div>
    <div id="r-logwrap" hidden><h3>TRANSCRIPT</h3><div id="log"></div></div>
    <h3>TRAIL</h3>
    <div class="trail" id="r-trail"></div>
  </aside>
</main>
<div id="veil" hidden></div>
<div id="sheet" hidden></div>

<script src="world.js"></script>
<script src="vendor/zvm.js"></script>
<script src="story.js"></script>
<script src="engine.js"></script>
<script src="walkthrough.js"></script>
<script src="solver.js"></script>
<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------ *
   * Two ways to walk the same dungeon.
   *
   * ATLAS mode reads the graph extracted from the ZIL source: every room
   * and every exit, walkable with no server and no game engine.
   *
   * LIVE mode runs zork1.zip on a Z-machine interpreter in this page —
   * no server, nothing to install. Clicks become real commands, and the
   * map is built from the game's own room object numbers, so a maze of
   * rooms that all describe themselves identically still maps correctly.
   *
   * Both modes feed one graph model, so the map code below is shared.
   * ------------------------------------------------------------------ */

  var ATLAS = window.WORLD;
  var ROOMS = {};
  ATLAS.rooms.forEach(function (r) { ROOMS[r.id] = r; });

  // Room name -> ZIL room, used in live mode to hint which directions are
  // worth trying. Names shared by several rooms (Maze, Forest, Dead End)
  // are dropped: an ambiguous hint is worse than none.
  var BY_NAME = {};
  ATLAS.rooms.forEach(function (r) {
    var k = r.name.toLowerCase();
    BY_NAME[k] = BY_NAME.hasOwnProperty(k) ? null : r;
  });

  var DIRS = ["NORTH", "NE", "EAST", "SE", "SOUTH", "SW", "WEST", "NW",
              "UP", "DOWN", "IN", "OUT"];
  var WORD = {
    NORTH: "north", SOUTH: "south", EAST: "east", WEST: "west",
    NE: "northeast", NW: "northwest", SE: "southeast", SW: "southwest",
    UP: "up", DOWN: "down", IN: "in", OUT: "out", LAND: "land"
  };
  var VEC = {
    NORTH: [0, -1], SOUTH: [0, 1], EAST: [1, 0], WEST: [-1, 0],
    NE: [1, -1], NW: [-1, -1], SE: [1, 1], SW: [-1, 1],
    UP: [0, 0], DOWN: [0, 0], IN: [0, 0], OUT: [0, 0], LAND: [0, 0]
  };
  var VERTICAL = { UP: 1, DOWN: 1, IN: 1, OUT: 1, LAND: 1 };

  var STEP_X = 190, STEP_Y = 110, BOX_W = 148, BOX_H = 54;

  var mode = "atlas";
  var engine = null;    // the Z-machine, once the live game starts
  var live = null;      // its most recent snapshot
  var busy = false;
  var state;            // per-mode map state, see fresh()

  /* ---------- per-mode state ---------- */

  // The command words that are movement, mapped back to compass points, so
  // a replayed game draws real edges instead of a scatter of rooms.
  var DIR_OF = {};
  Object.keys(WORD).forEach(function (d) { DIR_OF[WORD[d]] = d; });
  ["n:NORTH", "s:SOUTH", "e:EAST", "w:WEST", "ne:NE", "nw:NW", "se:SE",
   "sw:SW", "u:UP", "d:DOWN"].forEach(function (pair) {
    var p = pair.split(":");
    DIR_OF[p[0]] = p[1];
  });

  function key() { return "zork-map-v2-" + mode; }

  function fresh() {
    var s = { pos: {}, current: null, moves: 0, trail: [], nodes: {}, session: 0 };
    if (mode === "atlas") {
      s.current = ATLAS.start;
      s.pos[s.current] = { x: 0, y: 0 };
      s.trail = [s.current];
    }
    return s;
  }

  function load() {
    try {
      var raw = localStorage.getItem(key());
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (!s || !s.pos || s.current === null || s.current === undefined) return null;
      if (mode === "atlas" && !ROOMS[s.current]) return null;
      return s;
    } catch (e) { return null; }
  }

  function save() {
    try { localStorage.setItem(key(), JSON.stringify(state)); } catch (e) {}
  }

  /* ---------- one graph model over both modes ---------- */

  function node(id) {
    return mode === "atlas" ? ROOMS[id] : state.nodes[id];
  }

  // Exits as [{dir, to, cond}] regardless of where they came from.
  function exitsOf(id) {
    var n = node(id);
    if (!n) return [];
    if (mode === "atlas") return n.exits;
    return Object.keys(n.exits).map(function (d) {
      return { dir: d, to: n.exits[d], cond: "" };
    });
  }

  function hasTreasure(id) {
    var n = node(id);
    return !!(n && n.objects && n.objects.some(function (o) { return o.treasure; }));
  }

  function known(id) { return state.pos.hasOwnProperty(id); }

  function occupied(x, y) {
    for (var id in state.pos) {
      if (state.pos[id].x === x && state.pos[id].y === y) return true;
    }
    return false;
  }

  // Zork's geography is not Euclidean: exits loop back on themselves and two
  // directions can land in the same place. Put a new room at its natural
  // offset, and when that cell is taken, spiral out to the nearest free one.
  // The drawn edge keeps the true connection visible however far it slid.
  function place(id, from, dir) {
    if (known(id)) return;
    if (!from) { state.pos[id] = { x: 0, y: 0 }; return; }
    var v = VEC[dir] || [0, 0];
    var ox = from.x + v[0], oy = from.y + v[1];
    if (!occupied(ox, oy)) { state.pos[id] = { x: ox, y: oy }; return; }
    for (var r = 1; r < 60; r++) {
      for (var dx = -r; dx <= r; dx++) {
        for (var dy = -r; dy <= r; dy++) {
          if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
          if (!occupied(ox + dx, oy + dy)) {
            state.pos[id] = { x: ox + dx, y: oy + dy };
            return;
          }
        }
      }
    }
    state.pos[id] = { x: ox, y: oy };
  }

  function arrive(id, from, dir, recenter) {
    place(id, from ? state.pos[from] : null, dir);
    state.current = id;
    state.trail.push(id);
    if (state.trail.length > 60) state.trail.shift();
    // Walking follows the camera; jumping to a room you just clicked does
    // not, since you are already looking straight at it.
    if (recenter !== false) center();
    save();
    draw();
    panel();
  }

  /* ---------- atlas mode ---------- */

  function atlasGo(dir, to) {
    state.moves++;
    arrive(to, state.current, dir);
  }

  function revealAll() {
    var queue = [state.current], seen = {};
    seen[state.current] = 1;
    while (queue.length) {
      var id = queue.shift();
      exitsOf(id).forEach(function (e) {
        if (!known(e.to)) place(e.to, state.pos[id], e.dir);
        if (!seen[e.to]) { seen[e.to] = 1; queue.push(e.to); }
      });
    }
    if (mode === "atlas") {
      // Rooms with no inbound path from here still belong on the map.
      ATLAS.rooms.forEach(function (r) {
        if (!known(r.id)) place(r.id, state.pos[state.current], "SOUTH");
      });
    }
    save();
    fit();
    panel();
  }

  /* ---------- live mode ---------- */

  function absorb(snap, cmd, dir) {
    var prev = state.current;
    var n = state.nodes[snap.id];
    if (!n) {
      n = state.nodes[snap.id] = {
        id: snap.id, name: snap.name, desc: snap.desc,
        objects: [], exits: {}, blocked: {}, tried: {}
      };
    }
    if (snap.desc) n.desc = snap.desc;
    n.name = snap.name;
    // Keep the interpreter's attribute read-out: it is what tells the panel
    // this is a closed container rather than just a noun.
    n.objects = snap.objects.map(function (o) {
      return {
        name: o.name, takeable: o.takeable, treasure: false,
        f: o.f, inside: o.inside
      };
    });

    if (dir && prev !== null && state.nodes[prev]) {
      state.nodes[prev].tried[dir] = 1;
      if (snap.moved) state.nodes[prev].exits[dir] = snap.id;
      else if (snap.blocked) state.nodes[prev].blocked[dir] = snap.output;
    }

    live = snap;
    state.moves = snap.moves;
    if (snap.id !== prev || state.current === null) {
      arrive(snap.id, snap.moved ? prev : null, dir || "IN");
    } else {
      save();
      draw();
      panel();
    }
    if (cmd) log(cmd, snap.output);
  }

  function send(cmd, dir) {
    if (busy || !engine) return;
    busy = true;
    var snap;
    try {
      snap = engine.command(cmd);
    } catch (e) {
      busy = false;
      log(cmd, "[the interpreter stumbled: " + e.message + "]");
      render();
      return;
    }
    busy = false;
    absorb(snap, cmd, dir);
  }

  function startLive() {
    engine = window.ZorkEngine.create();
    if (!engine) {
      alert("The interpreter did not load, so only the atlas is available.");
      return;
    }
    var snap = engine.snapshot(engine.banner);
    mode = "live";
    document.getElementById("mode").textContent = "LIVE";
    document.getElementById("s-scorewrap").hidden = false;
    document.getElementById("r-logwrap").hidden = false;
    document.getElementById("b-live").hidden = true;
    // Nothing to reveal in a live game: the only way to map a room is to
    // walk into it.
    document.getElementById("b-reveal").hidden = true;
    document.getElementById("b-reset").textContent = "restart";
    if (window.ZORK_WALKTHROUGH) {
      var rb = document.getElementById("b-replay");
      rb.hidden = false;
      rb.onclick = replayWin;
      rb.title = "a verified 350-point game, replayed from a pinned seed";
    }
    if (window.ZorkSolver) {
      var sb = document.getElementById("b-solve");
      sb.hidden = false;
      sb.onclick = solve;
      sb.title = "explores and scores on its own, knowing no walkthrough";
    }
    document.getElementById("hint").textContent =
      "every click runs a real command in zork1.zip · drag to pan · scroll to zoom";
    document.title = "ZORK I — playing";
    var saved = load();
    state = (saved && saved.session === snap.session) ? saved : fresh();
    state.session = snap.session;
    live = snap;
    absorb(snap, null, null);
    if (logLines.length === 0) log(null, snap.output || "");
  }

  /* ---------- replaying a complete, winning game ---------- */

  // A Z-machine is only as deterministic as its interpreter's dice. Pinning
  // ZVM's seed makes the whole run reproducible, so the same 431 commands
  // reach 350 points every time, drawing the map as they go.
  var replaying = null;

  function replayWin() {
    var plan = window.ZORK_WALKTHROUGH;
    if (!plan) return;
    if (replaying) { stopReplay(); return; }
    if (!confirm("Replay a complete winning game? This restarts what you " +
                 "are playing and takes about half a minute.")) return;

    engine = window.ZorkEngine.create(plan.seed);
    state = fresh();
    logLines = [];
    var snap = engine.snapshot(engine.banner);
    state.session = snap.session;
    absorb(snap, null, null);

    var i = 0;
    replaying = setInterval(function () {
      if (i >= plan.commands.length) return stopReplay();
      var cmd = plan.commands[i++];
      var next = engine.command(cmd);
      absorb(next, cmd, DIR_OF[cmd] || null);
      var b = document.getElementById("b-replay");
      b.textContent = "stop (" + i + "/" + plan.commands.length + ")";
      if (i % 40 === 0 || i === plan.commands.length) fit();
    }, 45);
    document.getElementById("b-replay").textContent = "stop";
  }

  /* ---------- letting it solve itself ---------- */

  var solving = null;

  function solve() {
    if (!window.ZorkSolver) return;
    if (solving) { stopSolve(); return; }
    if (replaying) stopReplay();
    if (!confirm("Turn a solver loose? It restarts the game and explores on " +
                 "its own, banking what treasure it can find.")) return;

    engine = window.ZorkEngine.create(42);
    state = fresh();
    logLines = [];
    var snap = engine.snapshot(engine.banner);
    state.session = snap.session;
    absorb(snap, null, null);

    var agent = window.ZorkSolver.create(engine, ATLAS, {
      maxMoves: 4000,
      onKept: function (cmd, res, dir) { absorb(res, cmd, DIR_OF[dir] || null); }
    });
    var b = document.getElementById("b-solve");
    solving = setInterval(function () {
      if (!agent.step()) {
        stopSolve();
        log(null, "The solver stopped: " + agent.stats.why + ". Score " +
                  agent.stats.score + "/350 in " + agent.stats.moves +
                  " moves, " + agent.stats.rooms + " rooms, " +
                  agent.stats.deaths + " deaths rewound.");
        return;
      }
      b.textContent = "stop (" + agent.stats.moves + " moves, " +
                      agent.stats.deaths + " deaths)";
      if (agent.stats.moves % 50 === 0) fit();
    }, 20);
    b.textContent = "stop";
  }

  function stopSolve() {
    clearInterval(solving);
    solving = null;
    document.getElementById("b-solve").textContent = "let it solve";
    fit();
    render();
  }

  function stopReplay() {
    clearInterval(replaying);
    replaying = null;
    document.getElementById("b-replay").textContent = "replay a win";
    fit();
    render();
  }

  var logLines = [];
  function log(cmd, out) {
    if (cmd) logLines.push({ cmd: cmd, out: out });
    else if (out) logLines.push({ cmd: null, out: out });
    if (logLines.length > 60) logLines.shift();
    var el = document.getElementById("log");
    el.innerHTML = logLines.map(function (l) {
      return (l.cmd ? '<span class="cmd">&gt; ' + esc(l.cmd) + "</span>\n" : "") +
             esc(l.out || "");
    }).join("\n\n");
    el.scrollTop = el.scrollHeight;
  }

  /* ---------- camera ---------- */

  var canvas = document.getElementById("map");
  var ctx = canvas.getContext("2d");
  var cam = { x: 0, y: 0, z: 1 };

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(canvas.clientWidth * dpr);
    canvas.height = Math.round(canvas.clientHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function center() {
    var p = state.pos[state.current];
    if (!p) return;
    cam.x = p.x * STEP_X;
    cam.y = p.y * STEP_Y;
    draw();
  }

  function fit() {
    var xs = [], ys = [];
    for (var id in state.pos) {
      xs.push(state.pos[id].x * STEP_X);
      ys.push(state.pos[id].y * STEP_Y);
    }
    if (!xs.length) return;
    var minx = Math.min.apply(null, xs), maxx = Math.max.apply(null, xs);
    var miny = Math.min.apply(null, ys), maxy = Math.max.apply(null, ys);
    cam.x = (minx + maxx) / 2;
    cam.y = (miny + maxy) / 2;
    cam.z = Math.max(0.08, Math.min(1.6, Math.min(
      canvas.clientWidth / (maxx - minx + BOX_W * 2),
      canvas.clientHeight / (maxy - miny + BOX_H * 4))));
    draw();
  }

  function toScreen(wx, wy) {
    return {
      x: (wx - cam.x) * cam.z + canvas.clientWidth / 2,
      y: (wy - cam.y) * cam.z + canvas.clientHeight / 2
    };
  }

  function roomAt(sx, sy) {
    for (var id in state.pos) {
      var p = toScreen(state.pos[id].x * STEP_X, state.pos[id].y * STEP_Y);
      if (Math.abs(sx - p.x) <= BOX_W / 2 * cam.z &&
          Math.abs(sy - p.y) <= BOX_H / 2 * cam.z) return id;
    }
    return null;
  }

  /* ---------- drawing ---------- */

  function draw() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.fillStyle = "#0b0d10";
    ctx.fillRect(0, 0, w, h);
    grid(w, h);

    Object.keys(state.pos).forEach(function (id) {
      var a = toScreen(state.pos[id].x * STEP_X, state.pos[id].y * STEP_Y);
      exitsOf(id).forEach(function (e) {
        if (!known(e.to)) { stub(a, e.dir); return; }
        var b = toScreen(state.pos[e.to].x * STEP_X, state.pos[e.to].y * STEP_Y);
        var back = exitsOf(e.to).some(function (x) { return String(x.to) === String(id); });
        var hot = String(id) === String(state.current) ||
                  String(e.to) === String(state.current);
        edge(a, b, e, back, hot);
      });
    });

    Object.keys(state.pos).forEach(box);
  }

  function grid(w, h) {
    if (cam.z < 0.35) return;
    ctx.strokeStyle = "#14181e";
    ctx.lineWidth = 1;
    var sx = STEP_X * cam.z, sy = STEP_Y * cam.z;
    var ox = (w / 2 - cam.x * cam.z) % sx, oy = (h / 2 - cam.y * cam.z) % sy;
    ctx.beginPath();
    for (var x = ox; x < w; x += sx) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
    for (var y = oy; y < h; y += sy) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
    ctx.stroke();
  }

  function edge(a, b, e, twoWay, hot) {
    var vertical = VERTICAL[e.dir];
    ctx.save();
    ctx.lineWidth = hot ? 2 : 1;
    ctx.strokeStyle = hot ? (vertical ? "#8fd0ff" : "#7fe07f")
                          : (vertical ? "#2f4a63" : "#2b333d");
    if (vertical || e.cond) ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.restore();

    if (!twoWay && cam.z > 0.3) arrowhead(a, b, hot ? "#7fe07f" : "#48545f");
    if (vertical && cam.z > 0.45) {
      ctx.fillStyle = hot ? "#8fd0ff" : "#4a6a85";
      ctx.font = "9px ui-monospace, monospace";
      ctx.textAlign = "center";
      ctx.fillText(e.dir, (a.x + b.x) / 2, (a.y + b.y) / 2 - 3);
    }
  }

  function arrowhead(a, b, color) {
    var ang = Math.atan2(b.y - a.y, b.x - a.x);
    var d = Math.hypot(b.x - a.x, b.y - a.y);
    if (d < 12) return;
    var tx = a.x + Math.cos(ang) * (d * 0.62);
    var ty = a.y + Math.sin(ang) * (d * 0.62);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - Math.cos(ang - 0.4) * 7, ty - Math.sin(ang - 0.4) * 7);
    ctx.lineTo(tx - Math.cos(ang + 0.4) * 7, ty - Math.sin(ang + 0.4) * 7);
    ctx.closePath();
    ctx.fill();
  }

  // Exits whose far side is still unknown get a short dashed stub and a "?",
  // so the frontier of the map is always visible.
  function stub(a, dir) {
    var v = VEC[dir] || [0, 0];
    var dx = v[0], dy = v[1];
    if (!dx && !dy) { dy = dir === "UP" ? -0.6 : 0.6; }
    var n = Math.hypot(dx, dy) || 1;
    var len = 34 * cam.z + BOX_W / 2 * cam.z;
    var bx = a.x + (dx / n) * len, by = a.y + (dy / n) * len;
    ctx.save();
    ctx.strokeStyle = "#39424d";
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(bx, by);
    ctx.stroke();
    ctx.restore();
    if (cam.z > 0.35) {
      ctx.fillStyle = "#4d5966";
      ctx.font = Math.max(8, 11 * cam.z) + "px ui-monospace, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("?", bx, by);
    }
  }

  function box(id) {
    var n = node(id);
    if (!n) return;
    var p = toScreen(state.pos[id].x * STEP_X, state.pos[id].y * STEP_Y);
    var w = BOX_W * cam.z, h = BOX_H * cam.z;
    if (p.x + w < 0 || p.x - w > canvas.clientWidth ||
        p.y + h < 0 || p.y - h > canvas.clientHeight) return;
    var here = String(id) === String(state.current);
    var gold = hasTreasure(id);

    ctx.fillStyle = here ? "#1d2b1d" : "#151a21";
    ctx.strokeStyle = here ? "#7fe07f" : (gold ? "#6b5c2c" : "#2c343e");
    ctx.lineWidth = here ? 2 : 1;
    ctx.beginPath();
    ctx.rect(p.x - w / 2, p.y - h / 2, w, h);
    ctx.fill();
    ctx.stroke();

    if (cam.z < 0.28) return;
    ctx.fillStyle = here ? "#cfe8cf" : "#98a3b0";
    var size = Math.max(8, 11 * Math.min(cam.z, 1.1));
    ctx.font = size + "px ui-monospace, monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    var label = n.name;
    var max = Math.floor(w / (size * 0.62));
    if (label.length > max) label = label.slice(0, Math.max(3, max - 1)) + "…";
    ctx.fillText(label, p.x, p.y);
    if (gold && cam.z > 0.5) {
      ctx.fillStyle = "#e0c060";
      ctx.fillText("✦", p.x + w / 2 - 8, p.y - h / 2 + 8);
    }
  }

  /* ---------- side panel ---------- */

  function panel() { render(); }

  function render() {
    var id = state.current, n = node(id);
    if (!n) return;

    document.getElementById("r-name").textContent = n.name;
    var desc = document.getElementById("r-desc");
    desc.textContent = n.desc || "";
    desc.className = "desc" + (window.innerWidth <= 760 ? " clamped" : "");
    desc.onclick = function () { desc.classList.toggle("clamped"); };

    var bits = [];
    if (mode === "atlas") {
      bits.push(n.id);
      if (n.value) bits.push(n.value + " pts");
      if (n.flags.indexOf("RLANDBIT") < 0) bits.push("not dry land");
      if (n.flags.indexOf("ONBIT") < 0) bits.push("dark");
      if (n.flags.indexOf("MAZEBIT") >= 0) bits.push("maze");
    } else {
      bits.push("object #" + n.id);
      if (live) bits.push("turn " + live.turns);
    }
    document.getElementById("r-meta").textContent = bits.join(" · ");

    items(n);
    if (mode === "atlas") atlasExits(n); else liveControls(n);

    // In the atlas the exits are how you get around, so they come before the
    // lore; in a live game the things in front of you come first.
    var itemsEl = document.getElementById("r-items");
    var exitsEl = document.getElementById("r-exits");
    if (mode === "atlas") itemsEl.parentNode.insertBefore(exitsEl, itemsEl);
    else itemsEl.parentNode.insertBefore(itemsEl, exitsEl);

    document.getElementById("r-trail").textContent =
      state.trail.slice(-12).map(function (t) {
        var m = node(t);
        return m ? m.name : "?";
      }).join(" → ");

    document.getElementById("s-rooms").textContent = Object.keys(state.pos).length;
    document.getElementById("s-of").textContent =
      mode === "atlas" ? "/" + ATLAS.rooms.length : "";
    document.getElementById("s-moves").textContent = state.moves;
    document.getElementById("s-edges").textContent = countEdges();
    if (live) document.getElementById("s-score").textContent = live.score;
  }

  function items(n) {
    var host = document.getElementById("r-items");
    host.innerHTML = "";
    if (mode === "live") return liveThings(host, n);
    return atlasThings(host, n);
  }

  /* ---------- the atlas: everything the source says, in plain sight ---- */

  function loreOf(name) {
    return ATLAS.lore[String(name || "").toLowerCase()];
  }

  // The verb-by-verb behaviour pulled out of the object's ACTION routine:
  // what it answers to, under what condition, and what it says back.
  function behaviourList(does) {
    var wrap = document.createElement("div");
    does.forEach(function (d) {
      var row = document.createElement("div");
      row.className = "says";
      var head = document.createElement("div");
      if (d.verbs.length) {
        var v = document.createElement("b");
        v.textContent = d.verbs.join(" / ");
        head.appendChild(v);
      }
      if (d.when) {
        var w = document.createElement("span");
        w.className = "when";
        w.textContent = (d.verbs.length ? " " : "") + d.when;
        head.appendChild(w);
      }
      row.appendChild(head);
      d.says.forEach(function (s) {
        var q = document.createElement("div");
        q.className = "quote";
        q.textContent = "“" + s + "”";
        row.appendChild(q);
      });
      wrap.appendChild(row);
    });
    return wrap;
  }

  function loreCard(name, treasure) {
    var o = loreOf(name);
    var card = document.createElement("div");
    card.className = "thing";
    var nm = document.createElement("div");
    nm.className = "nm" + (treasure ? " treasure" : "");
    nm.textContent = name;
    card.appendChild(nm);

    var facts = [];
    if (o) {
      facts = (o.is || []).slice();
      if (o.tvalue) facts.push(o.tvalue + " points for taking it");
      if (o.value) facts.push(o.value + " points in the case");
      if (o.capacity) facts.push("holds " + o.capacity);
    }
    if (facts.length) {
      var f = document.createElement("div");
      f.className = "what";
      f.textContent = facts.join(" · ");
      card.appendChild(f);
    }

    // How the game first shows it to you, and what it says when read.
    [o && o.fdesc, o && o.ldesc, o && o.text].forEach(function (t, i) {
      if (!t) return;
      if (i === 1 && o.fdesc === t) return;
      var d = document.createElement("div");
      d.className = "quote";
      d.textContent = "“" + t + "”";
      card.appendChild(d);
    });

    var does = (o && o.does) || [];
    if (does.length) {
      var btn = document.createElement("button");
      btn.textContent = "what it answers to (" + does.length + ")";
      var body = null;
      btn.onclick = function () {
        if (body) {
          body.remove();
          body = null;
          btn.textContent = "what it answers to (" + does.length + ")";
          return;
        }
        body = behaviourList(does);
        card.appendChild(body);
        btn.textContent = "hide";
      };
      card.appendChild(btn);
    }
    return card;
  }

  // What a locked door is actually waiting on. Traced backwards through the
  // source: the exit names a flag, the flag is set somewhere, and that
  // somewhere sits under a verb. Hence "odysseus" for the Cyclops wall.
  function unlockNote(needs) {
    var box = document.createElement("div");
    box.className = "unlock";
    var head = document.createElement("span");
    head.className = "key2";
    head.textContent = "opened by ";
    box.appendChild(head);
    var said = [];
    needs.slice(0, 3).forEach(function (h) {
      var verb = (h.verbs || []).join(" / ");
      var line = verb
        ? verb + (h.on ? " the " + h.on : "")
        : (h.on ? "something that happens to the " + h.on
                : "something the game does");
      if (h.when) line += " (" + h.when + ")";
      said.push(line);
    });
    box.appendChild(document.createTextNode(said.join(", or ")));
    if (needs[0].says && needs[0].says[0]) {
      var q = document.createElement("div");
      q.className = "quote";
      q.textContent = "“" + needs[0].says[0] + "”";
      box.appendChild(q);
    }
    return box;
  }

  function atlasThings(host, n) {
    if (n.does && n.does.length) {
      // The room's own logic. "On looking" is the description already
      // printed above, so it would only repeat itself here.
      var logic = n.does.filter(function (d) {
        return d.when !== "on looking";
      });
      if (logic.length) {
        section(host, "WHAT HAPPENS HERE");
        host.appendChild(behaviourList(logic));
      }
    }
    if (n.objects && n.objects.length) {
      section(host, "THINGS HERE");
      n.objects.forEach(function (o) {
        host.appendChild(loreCard(o.name, o.treasure));
      });
    }
    var scenery = (n.globals || []).concat(ATLAS.everywhere || []);
    if (scenery.length) {
      section(host, "ALSO REFERRABLE HERE",
              "scenery the room answers to without holding it");
      scenery.forEach(function (g) { host.appendChild(loreCard(g, false)); });
    }
  }

  function cmdButton(label, cmd) {
    var b = document.createElement("button");
    b.textContent = label;
    b.disabled = busy;
    b.onclick = function () { send(cmd, null); };
    return b;
  }

  /* ---------- everything you can name, as chips ---------- */

  // Three sources: what the interpreter says is in the room, what you are
  // carrying, and the scenery the ZIL source lists for this room. The third
  // matters more than it sounds — the kitchen window is not in any room's
  // object tree, so without it you could not open the window without typing.
  function nouns(n) {
    var out = [], seen = {};
    function push(label, kind) {
      var key = label.toLowerCase();
      if (!label || seen[key]) return;
      seen[key] = 1;
      out.push({ label: label, kind: kind });
    }
    (n.objects || []).forEach(function (o) { push(o.name, "here"); });
    (live && live.inventory || []).forEach(function (o) { push(o.name, "carried"); });
    var zil = BY_NAME[(n.name || "").toLowerCase()];
    if (zil) (zil.globals || []).forEach(function (g) { push(g, "scenery"); });
    (ATLAS.everywhere || []).forEach(function (g) { push(g, "scenery"); });
    return out;
  }

  /* ---------- what a thing is, and what you can do with it ---------- */

  // Reads the object's attribute bits into a plain-English line, so a thing
  // in the list says what it is rather than only what it is called.
  function describeItem(it, carried) {
    var f = it.f || {}, bits = [];
    if (f.actor) bits.push("alive");
    if (f.light) bits.push(f.on ? "lit" : "a lamp, not lit");
    if (f.flame && !f.light) bits.push(f.on ? "burning" : "burnable");
    if (f.container || f.surface) {
      bits.push(f.surface ? "a surface" :
                (f.open ? "an open container" : "a closed container"));
    }
    if (f.door) bits.push(f.open ? "an open door" : "a closed door");
    if (f.read) bits.push("readable");
    if (f.weapon) bits.push("a weapon");
    if (f.tool) bits.push("a tool");
    if (f.food) bits.push("edible");
    if (f.drink) bits.push("drinkable");
    if (f.vehicle) bits.push("rideable");
    if (f.climb) bits.push("climbable");
    if (!bits.length && !carried && !f.take) bits.push("scenery");
    if (it.inside && it.inside.length) {
      bits.push("holding " + it.inside.map(function (x) {
        return x.name;
      }).join(", "));
    } else if (it.inside && (f.open || f.trans)) {
      bits.push("empty");
    }
    return bits.join(" · ");
  }

  // The verbs worth surfacing for this particular thing, in the order they
  // are worth trying. Everything else is still one tap away under the sheet.
  function verbsFor(it, carried) {
    var f = it.f || {}, v = [];
    if (carried) v.push("drop");
    else if (f.take) v.push("take");
    if (f.container || f.door) v.push(f.open ? "close" : "open");
    if ((f.container || f.surface) && (f.open || f.trans)) v.push("look in");
    if (f.read) v.push("read");
    if (f.light) v.push(f.on ? "turn off" : "turn on");
    if (f.food) v.push("eat");
    if (f.drink) v.push("drink");
    if (f.vehicle) v.push("board");
    if (f.climb) v.push("climb");
    if (f.search) v.push("search");
    if (f.turn) v.push("turn");
    // Everything can be examined, and anything sitting there can be shoved
    // about or looked under. Without this tail a flagless object offers
    // nothing but "examine" — and the rug in the living room, which hides
    // the trap door and is the whole opening of the game, is flagless.
    v.push("examine", "move", "look under", "push");
    return v.filter(function (x, i) { return v.indexOf(x) === i; });
  }

  // Verbs where this thing is the *second* object: the sword you attack with,
  // the sack you put things in. Without these, a weapon in your hands offers
  // nothing to do with the troll in front of you.
  function verbsWith(it) {
    var f = it.f || {}, v = [];
    if (f.weapon) v.push({ phrase: "attack", prep: "with" },
                         { phrase: "kill", prep: "with" });
    if (f.container || f.surface) v.push({ phrase: "put", prep: "in" });
    if (f.surface) v.push({ phrase: "put", prep: "on" });
    if (f.flame || f.light) v.push({ phrase: "burn", prep: "with" },
                                   { phrase: "light", prep: "with" });
    if (f.tool) v.push({ phrase: "open", prep: "with" },
                       { phrase: "move", prep: "with" },
                       { phrase: "dig", prep: "with" },
                       { phrase: "unlock", prep: "with" });
    return v;
  }

  function itemRow(it, carried) {
    var row = document.createElement("div");
    row.className = "thing";
    var head = document.createElement("div");
    head.className = "nm";
    head.textContent = it.name;
    row.appendChild(head);
    var what = describeItem(it, carried);
    if (what) {
      var sub = document.createElement("div");
      sub.className = "what";
      sub.textContent = what;
      row.appendChild(sub);
    }
    var acts = document.createElement("div");
    acts.className = "row";
    verbsFor(it, carried).slice(0, 3).forEach(function (v) {
      acts.appendChild(cmdButton(v, v + " " + it.name));
    });
    var more = document.createElement("button");
    more.textContent = "more…";
    more.disabled = busy;
    more.onclick = function () { openSheet(it.name, it, carried); };
    acts.appendChild(more);
    row.appendChild(acts);
    return row;
  }

  function section(host, title, note) {
    var h = document.createElement("h3");
    h.textContent = title;
    host.appendChild(h);
    if (note) {
      var d = document.createElement("div");
      d.className = "what";
      d.textContent = note;
      host.appendChild(d);
    }
  }

  // A thing, then anything visible inside it, indented one step.
  function addThing(host, it, carried) {
    host.appendChild(itemRow(it, carried));
    (it.inside || []).forEach(function (child) {
      var row = itemRow(child, false);
      row.className = "thing nested";
      host.appendChild(row);
    });
  }

  function liveThings(host, n) {
    var carried = (live && live.inventory) || [];
    section(host, "YOU ARE CARRYING",
            carried.length ? "" : "nothing at all");
    carried.forEach(function (it) { addThing(host, it, true); });

    var here = n.objects || [];
    if (here.length) {
      section(host, "HERE");
      here.forEach(function (it) { addThing(host, it, false); });
    }

    // Scenery has no object of its own to inspect, so it stays as chips.
    var scenery = nouns(n).filter(function (t) { return t.kind === "scenery"; });
    if (scenery.length) {
      section(host, "ALSO HERE");
      var wrap = document.createElement("div");
      wrap.className = "chips";
      scenery.forEach(function (t) {
        var b = document.createElement("button");
        b.className = "chip scenery";
        b.textContent = t.label;
        b.disabled = busy;
        b.onclick = function () { openSheet(t.label); };
        wrap.appendChild(b);
      });
      host.appendChild(wrap);
    }
  }

  /* ---------- the action sheet ---------- */

  var sheet = document.getElementById("sheet");
  var veil = document.getElementById("veil");
  veil.onclick = closeSheet;

  function closeSheet() {
    sheet.hidden = veil.hidden = true;
    sheet.innerHTML = "";
  }

  function sheetHead(title, back) {
    sheet.innerHTML = "";
    var h = document.createElement("h4");
    h.appendChild(document.createTextNode(title));
    var x = document.createElement("button");
    x.className = "x";
    x.textContent = back ? "back" : "close";
    x.onclick = back || closeSheet;
    h.appendChild(x);
    sheet.appendChild(h);
    sheet.hidden = veil.hidden = false;
    sheet.scrollTop = 0;
  }

  function verbGrid(verbs, label, onPick) {
    var note = document.createElement("div");
    note.className = "sub";
    note.textContent = label;
    sheet.appendChild(note);
    var grid = document.createElement("div");
    grid.className = "grid";
    verbs.forEach(function (v) {
      var b = document.createElement("button");
      b.textContent = v.prep ? v.phrase + " … " + v.prep + " …" : v.phrase;
      b.onclick = function () { onPick(v); };
      grid.appendChild(b);
    });
    sheet.appendChild(grid);
    return grid;
  }

  // The first dozen verbs of each shape cover almost everything anyone
  // reaches for; the rest of the parser's grammar is one tap further in.
  var SHOWN = 12;

  function openSheet(thing, it, carried) {
    var one = ATLAS.verbs.one, two = ATLAS.verbs.two;
    sheetHead(thing);
    if (it) {
      var what = describeItem(it, carried);
      if (what) {
        var sub = document.createElement("div");
        sub.className = "sub";
        sub.textContent = what;
        sheet.appendChild(sub);
      }
      var fits = verbsFor(it, carried).map(function (p) { return { phrase: p }; });
      verbGrid(fits, "what this is for", function (v) {
        closeSheet();
        send(v.phrase + " " + thing, null);
      });
      var with_ = verbsWith(it);
      if (with_.length) {
        verbGrid(with_, "use it on something", function (v) {
          pickTarget(thing, v, true);
        });
      }
    }
    verbGrid(one.slice(0, SHOWN), it ? "anything else" : "do this to it",
      function (v) {
        closeSheet();
        send(v.phrase + " " + thing, null);
      });
    verbGrid(two.slice(0, SHOWN), "other two-part commands", function (v) {
      pickTarget(thing, v);
    });
    more(function () {
      sheetHead(thing + " — every verb", function () {
        openSheet(thing, it, carried);
      });
      verbGrid(one.slice(SHOWN), "do this to it", function (v) {
        closeSheet();
        send(v.phrase + " " + thing, null);
      });
      verbGrid(two.slice(SHOWN), "use it with something else", function (v) {
        pickTarget(thing, v);
      });
    });
  }

  function more(onClick) {
    var b = document.createElement("button");
    b.textContent = "more verbs…";
    b.style.marginTop = "12px";
    b.onclick = onClick;
    sheet.appendChild(b);
  }

  // reversed: the tapped thing is the instrument rather than the target, so
  // "attack … with sword" asks for the victim, not the weapon.
  function pickTarget(thing, verb, reversed) {
    var phrase = reversed
      ? verb.phrase + " %s " + verb.prep + " " + thing
      : verb.phrase + " " + thing + " " + verb.prep + " %s";
    sheetHead(phrase.replace("%s", "…"), function () { openSheet(thing); });
    var note = document.createElement("div");
    note.className = "sub";
    note.textContent = reversed ? "on what?" : "with what?";
    sheet.appendChild(note);
    var grid = document.createElement("div");
    grid.className = "grid";
    nouns(node(state.current)).forEach(function (t) {
      if (t.label.toLowerCase() === thing.toLowerCase()) return;
      var b = document.createElement("button");
      b.textContent = t.label;
      b.onclick = function () {
        closeSheet();
        send(phrase.replace("%s", t.label), null);
      };
      grid.appendChild(b);
    });
    sheet.appendChild(grid);
  }

  function atlasExits(n) {
    var host = document.getElementById("r-exits");
    host.innerHTML = "<h3>EXITS</h3>";
    document.getElementById("r-actions").innerHTML = "";
    n.exits.forEach(function (e, i) {
      var b = document.createElement("button");
      b.className = "exit";
      var seen = known(e.to);
      b.innerHTML =
        '<span class="key">' + (i < 9 ? i + 1 : "") + "</span>" +
        '<span class="dir">' + e.dir + "</span> → " +
        '<span class="' + (seen ? "" : "new") + '">' +
        esc(seen ? ROOMS[e.to].name : "unexplored") + "</span>" +
        (e.cond ? '<span class="cond">' + esc(e.cond) + "</span>" : "");
      b.onclick = function () { atlasGo(e.dir, e.to); };
      host.appendChild(b);
      if (e.needs && e.needs.length) host.appendChild(unlockNote(e.needs));
    });
    n.blocked.forEach(function (e) {
      var d = document.createElement("div");
      d.className = "blocked";
      d.innerHTML = '<span class="dir">' + e.dir + "</span> — " + esc(e.msg);
      host.appendChild(d);
    });
  }

  function liveControls(n) {
    var host = document.getElementById("r-exits");
    host.innerHTML = "<h3>GO</h3>";
    var hint = BY_NAME[(n.name || "").toLowerCase()];
    var hintDirs = {};
    if (hint) hint.exits.forEach(function (e) { hintDirs[e.dir] = 1; });

    var grid = document.createElement("div");
    grid.className = "compass";
    // Compass rose, then the vertical and threshold moves underneath.
    ["NW", "NORTH", "NE", "WEST", null, "EAST", "SW", "SOUTH", "SE",
     "UP", "DOWN", "IN"].forEach(function (d) {
      if (!d) {
        var pad = document.createElement("span");
        pad.className = "blank";
        grid.appendChild(pad);
        return;
      }
      var b = document.createElement("button");
      b.textContent = d;
      b.disabled = busy;
      var dest = n.exits[d];
      if (dest !== undefined) {
        b.className = "known";
        var to = state.nodes[dest];
        b.title = "to " + (to ? to.name : "?");
      } else if (n.blocked[d]) {
        b.className = "wall";
        b.title = n.blocked[d];
      } else if (hintDirs[d]) {
        b.className = "hint";
        b.title = "the ZIL source has an exit this way";
      }
      b.onclick = function () { send(WORD[d], d); };
      grid.appendChild(b);
    });
    host.appendChild(grid);

    var acts = document.getElementById("r-actions");
    acts.innerHTML = "<h3>DO</h3>";
    var row = document.createElement("div");
    row.className = "row";
    ATLAS.verbs.none.slice(0, 8).forEach(function (v) {
      row.appendChild(cmdButton(v.phrase, v.phrase));
    });
    if (live) {
      var u = document.createElement("button");
      u.textContent = "undo";
      u.disabled = busy || !live.canUndo;
      u.onclick = function () {
        if (busy) return;
        var s = engine.undo();
        absorb(s, null, null);
        log("undo", s.output);
      };
      row.appendChild(u);
    }
    var rest = ATLAS.verbs.none.slice(8);
    if (rest.length) {
      var b = document.createElement("button");
      b.textContent = "more…";
      b.onclick = function () {
        sheetHead("commands");
        verbGrid(rest, "no object needed", function (v) {
          closeSheet();
          send(v.phrase, null);
        });
      };
      row.appendChild(b);
    }
    acts.appendChild(row);

    // A keyboard is never required, but on a desktop it is sometimes faster.
    var free = document.createElement("div");
    free.className = "row";
    var typeBtn = document.createElement("button");
    typeBtn.textContent = "type instead";
    var input = document.createElement("input");
    input.placeholder = "any command…";
    input.hidden = true;
    input.style.cssText =
      "flex:1;min-width:140px;background:#0d1116;color:inherit;font:inherit;" +
      "border:1px solid #232a33;border-radius:3px;padding:8px 9px";
    typeBtn.onclick = function () {
      input.hidden = false;
      typeBtn.hidden = true;
      input.focus();
    };
    input.onkeydown = function (ev) {
      if (ev.key === "Enter" && input.value.trim()) {
        send(input.value.trim(), null);
        input.value = "";
      }
    };
    free.appendChild(typeBtn);
    free.appendChild(input);
    acts.appendChild(free);
  }

  function countEdges() {
    var n = 0;
    Object.keys(state.pos).forEach(function (id) {
      exitsOf(id).forEach(function (e) { if (known(e.to)) n++; });
    });
    return n;
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* ---------- input ---------- */

  // Pointer events cover mouse and touch in one path: one pointer pans and
  // taps, two pointers pinch to zoom.
  var pointers = {}, drag = null, pinch = null;

  function pointerList() {
    return Object.keys(pointers).map(function (k) { return pointers[k]; });
  }

  canvas.addEventListener("pointerdown", function (ev) {
    canvas.setPointerCapture(ev.pointerId);
    pointers[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
    var all = pointerList();
    if (all.length === 1) {
      drag = { x: ev.clientX, y: ev.clientY, moved: 0 };
      canvas.classList.add("drag");
    } else if (all.length === 2) {
      drag = null;
      pinch = { dist: spread(all), z: cam.z };
    }
  });

  canvas.addEventListener("pointermove", function (ev) {
    if (!pointers[ev.pointerId]) return;
    pointers[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
    var all = pointerList();
    if (pinch && all.length === 2) {
      var d = spread(all);
      if (pinch.dist > 0) {
        cam.z = Math.max(0.06, Math.min(2.5, pinch.z * (d / pinch.dist)));
        draw();
      }
      return;
    }
    if (!drag) return;
    drag.moved += Math.abs(ev.clientX - drag.x) + Math.abs(ev.clientY - drag.y);
    cam.x -= (ev.clientX - drag.x) / cam.z;
    cam.y -= (ev.clientY - drag.y) / cam.z;
    drag.x = ev.clientX;
    drag.y = ev.clientY;
    draw();
  });

  function endPointer(ev) {
    delete pointers[ev.pointerId];
    if (pointerList().length < 2) pinch = null;
    if (drag && drag.moved < 8) {
      var rect = canvas.getBoundingClientRect();
      var id = roomAt(ev.clientX - rect.left, ev.clientY - rect.top);
      // Fast travel is an atlas privilege: in a live game you can only get
      // somewhere by actually walking there.
      if (id && mode === "atlas" && id !== state.current) {
        state.moves++;
        arrive(id, null, null, false);
      }
    }
    drag = null;
    canvas.classList.remove("drag");
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);

  function spread(all) {
    return Math.hypot(all[0].x - all[1].x, all[0].y - all[1].y);
  }
  canvas.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    var rect = canvas.getBoundingClientRect();
    var mx = ev.clientX - rect.left - canvas.clientWidth / 2;
    var my = ev.clientY - rect.top - canvas.clientHeight / 2;
    var wx = cam.x + mx / cam.z, wy = cam.y + my / cam.z;
    cam.z = Math.max(0.06, Math.min(2.5, cam.z * (ev.deltaY < 0 ? 1.12 : 0.89)));
    cam.x = wx - mx / cam.z;
    cam.y = wy - my / cam.z;
    draw();
  }, { passive: false });

  var KEYS = {
    ArrowUp: "NORTH", ArrowDown: "SOUTH", ArrowLeft: "WEST", ArrowRight: "EAST",
    k: "NORTH", j: "SOUTH", h: "WEST", l: "EAST",
    y: "NW", u: "NE", b: "SW", n: "SE", "<": "UP", ">": "DOWN"
  };
  window.addEventListener("keydown", function (ev) {
    if (ev.target && ev.target.tagName === "INPUT") return;
    var cur = node(state.current);
    if (!cur) return;
    if (mode === "atlas" && ev.key >= "1" && ev.key <= "9") {
      var e = cur.exits[ev.key.charCodeAt(0) - 49];
      if (e) { ev.preventDefault(); atlasGo(e.dir, e.to); }
      return;
    }
    var dir = KEYS[ev.key];
    if (!dir) return;
    ev.preventDefault();
    if (mode === "live") { send(WORD[dir], dir); return; }
    var hit = cur.exits.filter(function (x) { return x.dir === dir; })[0];
    if (hit) atlasGo(hit.dir, hit.to);
  });

  document.getElementById("b-center").onclick = center;
  document.getElementById("b-fit").onclick = fit;
  document.getElementById("b-reveal").onclick = revealAll;
  document.getElementById("b-reveal").title =
    "lay out every room reachable from here at once";
  document.getElementById("b-reset").onclick = function () {
    if (mode === "atlas") {
      if (!confirm("Forget the map and start over at West of House?")) return;
      state = fresh();
      cam.z = 1;
      save();
      center();
      panel();
      return;
    }
    if (!confirm("Restart the game and forget the map?")) return;
    var snap = engine.restart();
    state = fresh();
    state.session = snap.session;
    logLines = [];
    cam.z = 1;
    absorb(snap, null, null);
    log(null, snap.output);
  };

  window.addEventListener("resize", resize);

  /* ---------- boot ---------- */

  state = load() || fresh();
  resize();
  center();
  panel();

  var liveButton = document.getElementById("b-live");
  if (window.ZorkEngine && window.ZVM && window.ZORK_STORY) {
    liveButton.onclick = startLive;
  } else {
    liveButton.hidden = true;
  }
})();
</script>
</body>
</html>
